[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krautils"
version = "0.1.0"
description = "A python package for parsing, merging, and analyzing Kraken2 output files."
authors = [{name = "Andrea Telatin", email = "andrea.telatin@quadram.ac.uk"}]
readme = "README.md"

requires-python = ">=3.8"
dependencies = [
    "pandas",
    "typer",
    "rich",
    "click",
    "matplotlib",
    "plotly"
]

[project.scripts]
kraut = "kraut.commands.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kraut*"]
exclude = ["db*", "data*", "kraken*", "scrapbook*"]
